name: Windows installer

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Set up Inno Setup
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup signature: $($signature.Status)"
          }
          $install = Start-Process -FilePath $download -ArgumentList "/PORTABLE=1 /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$compiler`"" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup returned $($install.ExitCode)." }
          "INNO_COMPILER=$(Join-Path $compiler 'ISCC.exe')" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build.ps1 -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v7
        with:
          name: VioletSoundpad-Setup
          path: artifacts/VioletSoundpad-Setup-*.exe
          if-no-files-found: error
